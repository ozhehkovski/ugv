# Velocity safety chain:
#   cmd_vel/{teleop,follow,nav} → cmd_mux → cmd_vel_mux → velocity_smoother → cmd_vel_smoothed
#   → safety_governor → cmd_vel_safe → vesc_driver (hard limits + ramp + watchdog, see robot.yaml)
#
# Chassis (base_footprint = drive-axle center): x ∈ [-0.065, 0.555], y ∈ [-0.28, 0.28].
# Tank-turn sweep radius of the nose corners ≈ 0.62 m.

cmd_mux:
  ros__parameters:
    inputs: ["teleop", "follow", "nav"]
    rate_hz: 20.0
    teleop: {topic: "cmd_vel/teleop", priority: 100, timeout: 0.3}   # a lost release costs ≤0.3 s of travel
    follow: {topic: "cmd_vel/follow", priority: 50, timeout: 0.3}
    nav: {topic: "cmd_vel/nav", priority: 10, timeout: 0.5}

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true           # keep the curvature when one axis is limited
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.8]    # below the driver hard caps (0.55 / 0.9)
    min_velocity: [-0.25, 0.0, -0.8] # reverse slowly: no sensor looks backwards
    max_accel: [0.3, 0.0, 1.0]       # soft start
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Direction-aware collision governor (ugv_drivers/safety_governor.py). Replaces Nav2 Humble's
# collision_monitor: its stop polygon zeroed EVERY command while a point was inside it, which
# trapped the robot next to a sofa (it could not even back away). The governor simulates the body
# along the commanded arc and only limits motion that closes in on an obstacle.
safety_governor:
  ros__parameters:
    stop_margin: 0.05      # m, minimum clearance between the body and any lidar point
    horizon: 1.5           # s, look-ahead; the command scales with time-to-violation / horizon
    scan_timeout: 0.5      # s, no fresh scan → zero command

lifecycle_manager_safety:
  ros__parameters:
    autostart: true
    node_names: ["velocity_smoother"]
    bond_timeout: 4.0
